<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>RC Directory Anki Pack Generator</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Noto+Color+Emoji&display=swap">
    <style>
        :root {
            font-family: "Fira Code", "Noto Color Emoji", monospace;
            accent-color: #000;
        }

        body {
            margin: 0 auto;
            padding: 0 1rem;
            max-width: 800px;
        }

        header {
            text-align: center;
        }

        a {
            color: #3c89c3;
        }

        select, button {
            font-family: inherit;
            font-size: inherit;
            background-color: #f0f0f0;
            border: 1px solid #000;
            border-radius: 0;
            cursor: pointer;
        }

        label:has(input[type="radio"]) {
            cursor: pointer;
        }

        input[type="radio"] {
            margin: 0 0.5em 0 0;
        }

        select {
            margin: 0 0 0 0.5em;
        }

        .pack-form {
            padding: 1rem 0;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .pack-form fieldset {
            padding: 1em;
            flex: 1;
            white-space: nowrap;
            border: 1px solid #000;
            display: flex;
            flex-direction: column;
            gap: 0.5em;
        }

        .pack-form:has(input[value="batch"]:not(:checked)) .batch-selector {
            display: none;
        }

        .submit-button-wrapper {
            width: 100%;
            text-align: center;
        }

        .submit-button {
            font-size: 2rem;
            min-width: 10rem;
        }
    </style>
</head>
<body>
<header>
    <h1 class="header">RC Directory Anki Pack Generator</h1>
</header>
<main>
    <p>Build an Anki study deck from the Recurse Center directory to get familiar with your batchmates. 🐙</p>
    <p>Anki is a flashcard program that uses spaced repetition to improve long-term retention. Read more about Anki and
        download it <a target="_blank" rel="noreferrer" href="https://apps.ankiweb.net/">here</a>.</p>
    <form class="pack-form" action="{{ url_for('api.generate_pack') }}" method="post">
        <fieldset class="pack-selector">
            <legend>Select a pack</legend>
            <label><input type="radio" name="scope" value="current" checked/> At RC now</label>
            <label><input type="radio" name="scope" value="overlap"/> At RC with me</label>
            <label><input type="radio" name="scope" value="batch"/> Batch booster pack</label>
        </fieldset>
        <fieldset class="batch-selector">
            <legend>Pick a batch</legend>
            <label>Batch: <select name="batch_id">{% for batch in batches %}
                <option value="{{ batch.id }}">{{ batch.name }}</option>{% endfor %}
            </select></label>
        </fieldset>
        <div class="submit-button-wrapper">
            <button class="submit-button" type="submit">Go!</button>
        </div>
    </form>
</main>
</body>
</html>
